name: API Documentation Screenshot

on:
  push:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start API and capture docs
        run: |
          uvicorn dugout.api:app --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/docs && break
            sleep 2
          done
          python -m playwright screenshot --wait-for-selector ".swagger-ui .opblock" --full-page http://127.0.0.1:8000/docs docs.png

      - uses: actions/upload-artifact@v4
        with:
          name: API-Docs
          path: docs.png
